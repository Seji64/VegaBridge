name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# One build at a time per branch: a new push cancels the in-flight one,
# so queued builds never pile up behind each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Build
        # EnableCodeSigning=false: CI runners have no Apple signing certs;
        # compile-only check, signing happens on the dev machine / release pipeline.
        run: dotnet build src/VegaBridgeApp/VegaBridgeApp.csproj -c Debug -p:EnableCodeSigning=false
