name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# One build at a time per branch: a new push cancels the in-flight one,
# so queued builds never pile up behind each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The .NET iOS/MacCatalyst 27 workload requires Xcode 27; macos-26 only ships 26.x.
    # GitHub's images are now per Xcode major (there is no macos-27 label).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        # Navigation core, compiled into a plain net10.0 test project.
        run: dotnet test src/VegaBridgeApp.Tests/VegaBridgeApp.Tests.csproj

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Build
        # EnableCodeSigning=false: CI runners have no Apple signing certs;
        # compile-only check, signing happens on the dev machine / release pipeline.
        run: dotnet build src/VegaBridgeApp/VegaBridgeApp.csproj -c Debug -p:EnableCodeSigning=false
